<!DOCTYPE html>
<html>
<head>
    <title>Smart Crop Advisory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
    <h1>🌾 Smart Crop Advisory</h1>

    <div class="input-group">
        <label>District</label>
        <input type="text" id="district" placeholder="Enter district">
    </div>

    <div class="input-group">
        <label>Month</label>
        <select id="month">
            <option>January</option>
            <option>March</option>
            <option>June</option>
            <option>September</option>
            <option>December</option>
        </select>
    </div>
<!--temprature-->
    <div class="row">
        <div class="input-group">
            <label>Temperature (°C)</label>
            <input type="number" id="temp">
        </div>

        <div class="input-group">
            <label>Rainfall (mm)</label>
            <input type="number" id="rain">
        </div>
    </div>

    <button onclick="getCrop()">Get Recommendation</button>

    <div id="resultBox" class="hidden"></div>
</div>

<script src="script.js"></script>
</body>
</html>
